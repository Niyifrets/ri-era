<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RI-ERA'S KITCHEN | Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <img src="logo-dark.png" alt="RI-ERA'S KITCHEN" class="login-logo">
            <h1>Admin Login</h1>
            <p>RI-ERA'S KITCHEN — Akwa-Ibom, Nigeria</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Admin email" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn">Login</button>
                <p id="loginMessage"></p>
            </form>
        </div>
    </main>

    <script type="module" src="login.js"></script>

</body>
</html>
